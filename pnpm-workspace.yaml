packages:
  - 'apps/*'
  - 'packages/*'

# Native postinstall scripts are blocked by default in pnpm 10+. Allow only the
# packages that genuinely build a native binary, so a reviewer's install is
# non-interactive without opting into arbitrary script execution.
allowBuilds:
  '@swc/core': true

minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.117.0'
  - '@supabase/functions-js@2.117.0'
  - '@supabase/postgrest-js@2.117.0'
  - '@supabase/realtime-js@2.117.0'
  - '@supabase/storage-js@2.117.0'
  - '@supabase/supabase-js@2.117.0'
  - openai@7.22.0
