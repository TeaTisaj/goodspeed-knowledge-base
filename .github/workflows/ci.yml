name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests run against the deterministic fake provider, so CI needs no
      # API keys and no network.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Retrieval quality is a build gate, not a thing to notice later. Runs
      # against the fake provider, so no secrets and no network.
      - name: Retrieval eval
        run: pnpm eval --min-hit-rate=0.85

  database:
    name: migrations / RLS / integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm exec supabase start

      # Locally these come from the gitignored .env that `pnpm bootstrap` writes.
      # Read back from the CLI rather than hard-coded, so they can't go stale.
      - name: Export Supabase credentials
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm exec supabase db reset --no-seed

      - name: Build shared packages
        run: pnpm build --filter=@kb/contracts --filter=@kb/ai --filter=@kb/rag

      # The security claim. Runs against real Postgres with real user JWTs,
      # because a mocked RLS test proves nothing about RLS.
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm bootstrap` is the same command a reviewer runs, so CI fails when
      # the documented setup path breaks on a clean checkout.
      - name: Bootstrap the stack
        run: pnpm bootstrap

      # Playwright's webServer starts the API and the web app and waits for each
      # to answer on its own readiness URL.
      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
