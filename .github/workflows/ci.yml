name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests run against the deterministic fake provider, so CI needs no
      # API keys and no network.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Retrieval quality is a build gate, not a thing to notice later. Runs
      # against the fake provider, so no secrets and no network.
      - name: Retrieval eval
        run: pnpm eval --min-hit-rate=0.85

  database:
    name: migrations / RLS / integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm exec supabase start

      # The integration tests read these from the environment. Locally they come
      # from the .env that `pnpm setup` writes, which is gitignored and so absent
      # here -- without this step every client is built with an empty key and the
      # suite fails with "supabaseKey is required" before touching a policy.
      # Read back from the CLI rather than hard-coded, so a change in the local
      # stack cannot leave CI asserting against stale credentials.
      - name: Export Supabase credentials
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|DB_URL)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm exec supabase db reset --no-seed

      - name: Build shared packages
        run: pnpm build --filter=@kb/contracts --filter=@kb/ai --filter=@kb/rag

      # The security claim. Runs against real Postgres with real user JWTs,
      # because a mocked RLS test proves nothing about RLS.
      - name: Integration tests
        run: pnpm test:integration
